<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>gx10 · DGX Spark</title>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="dot" id="connDot"></span><span class="title">gx10</span><span class="sub">DGX Spark</span></div>
  <div class="topmeta">
    <span id="up">—</span><span class="sep">·</span>
    <span>Load <b id="load">—</b></span><span class="sep">·</span>
    <span id="alertBadge" class="badge">OK</span>
  </div>
</header>

<div id="alertWave"></div>

<main>
  <section id="hero">
    <canvas id="fx"></canvas>
    <div id="heroHud">
      <div class="hudrow"><label>GPU</label><b id="hGpu">—</b></div>
      <div class="hudrow"><label>SoC MAX</label><b id="hTemp">—</b></div>
      <div class="hudrow"><label>RAM</label><b id="hMem">—</b></div>
      <div class="hudrow right"><button id="fxToggle" title="Toggle 3D effects">✦ FX</button></div>
    </div>
  </section>

  <section id="rows">
    <div class="card" id="cGpu">
      <h3>GPU <small id="gpuPctl">—</small><span class="ranges" data-t="gpu"></span></h3>
      <div class="mini"><span id="gTemp">—</span><span id="gPow">—</span></div>
      <div class="chart"><canvas id="chGpu"></canvas></div>
    </div>
    <div class="card" id="cCpu">
      <h3>CPU <small id="cpuPctl">—</small><span class="ranges" data-t="cpu"></span></h3>
      <div class="chart"><canvas id="chCpu"></canvas></div>
    </div>
    <div class="card" id="cMem">
      <h3>RAM <small id="memPctl">—</small><span class="ranges" data-t="mem"></span></h3>
      <div class="mini"><span id="mSwap">—</span></div>
      <div class="chart"><canvas id="chMem"></canvas></div>
    </div>
    <div class="card" id="cTemp">
      <h3>Temp <small>SoC·NVMe</small><span class="ranges" data-t="temp"></span></h3>
      <div class="chart"><canvas id="chTemp"></canvas></div>
    </div>
    <div class="card" id="cNet">
      <h3>Net <small>↓ Down · ↑ Up</small><span class="ranges" data-t="net"></span></h3>
      <div class="chart"><canvas id="chNet"></canvas></div>
    </div>
    <div class="card" id="cDisk">
      <h3>Disk <small>R/W MB/s · usage % right axis</small><span class="ranges" data-t="disk"></span></h3>
      <div class="chart"><canvas id="chDisk"></canvas></div>
    </div>
  </section>

  <section id="procs">
    <div class="card half" id="pCpu">
      <h3>Top CPU<span class="ranges" data-p="proccpu"></span></h3>
      <table id="tCpu"><thead><tr><th>PID</th><th>Process</th><th>%</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card half" id="pMem">
      <h3>Top MEM<span class="ranges" data-p="procmem"></span></h3>
      <table id="tMem"><thead><tr><th>PID</th><th>Process</th><th>MB</th></tr></thead><tbody></tbody></table>
    </div>
  </section>

  <section id="bench">
    <div class="card" id="bBench">
      <h3>LLM Bench <small>prefill · decode · TTFT</small><span class="ranges" data-p="bench"></span></h3>
      <div class="benchbox">
        <div class="benchform">
          <input id="bEndpoint" type="text" placeholder="http://host:port" spellcheck="false" autocomplete="off">
          <span class="keywrap">
            <input id="bKey" type="password" placeholder="API key (optional)" autocomplete="off">
            <button type="button" id="bEye" title="Show / hide key">◉</button>
          </span>
          <input id="bModel" type="text" list="bModels" placeholder="model" spellcheck="false" autocomplete="off">
          <datalist id="bModels"></datalist>
          <button type="button" id="bModelLoad" title="Fetch model list from endpoint">⬇ List</button>
        </div>
        <div class="benchform">
          <label class="bnum" title="Tokens generated in the decode phase">Max tok <input id="bMaxTok" type="text" inputmode="numeric" maxlength="5" value="512"></label>
          <label class="bnum" title="Approximate prompt size in words">Words <input id="bWords" type="text" inputmode="numeric" maxlength="5" value="2000"></label>
          <label class="bchk" title="Keep thinking/reasoning tokens (counted into decode)"><input id="bThink" type="checkbox"> Think</label>
          <label class="bchk" title="Store the key in this browser (localStorage)"><input id="bRemember" type="checkbox"> Remember key</label>
          <button type="button" id="bRun" class="brun">▶ Run</button>
          <input id="bLabel" type="text" class="benchlabel" placeholder="Comment (optional — recorded as the last column of history)" spellcheck="false" autocomplete="off">
        </div>
        <div id="bNote" class="bnote"></div>
        <div class="bstats">
          <div class="bstat"><label>TTFT</label><b id="bTtft">—</b></div>
          <div class="bstat"><label>PREFILL <span id="bPreB" class="bbadge"></span><small>tok/s</small></label><b id="bPre">—</b></div>
          <div class="bstat"><label>DECODE <span id="bDecB" class="bbadge"></span><small>tok/s</small></label><b id="bDec">—</b></div>
          <div class="bmeta" id="bMeta"></div>
        </div>
        <div class="bhistbar"><span>HISTORY</span><button type="button" id="bClear" title="Clear all history rows">✕ Clear</button></div>
<table id="bHist"><thead><tr><th>Date</th><th>Endpoint</th><th>Model</th><th>TTFT</th><th>Prefill</th><th>Decode</th><th>Note</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
